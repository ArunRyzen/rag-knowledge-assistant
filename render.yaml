# Render blueprint — deploy the API as a Docker web service.
# Create a Render account, connect this repo, and Render reads this file.
# (Equivalent fly.io / Railway configs are a Dockerfile + a start command.)

services:
  - type: web
    name: rag-knowledge-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VECTOR_STORE
        value: pinecone        # or "memory" for a stateless demo (re-embeds on each boot)
      - key: PINECONE_INDEX
        value: rag-assistant
      # Set these as SECRETS in the Render dashboard (never in this file):
      # - key: GEMINI_API_KEY    (required — embeddings + answers)
      # - key: PINECONE_API_KEY  (required when VECTOR_STORE=pinecone)
